name: Release & Publish

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Manually publish this version to npm (e.g. 0.4.1). Skips release-please. Leave blank to only refresh the committed package."
        required: false
      sync_package:
        description: "Rebuild crates/wasm/pkg and commit it to main"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # `secrets` is not a valid context in a step-level `if`. Surface only a
    # derived availability flag; keep the credentials scoped to token minting.
    env:
      HAS_APP_CREDENTIALS: ${{ secrets.BREPKIT_BOT_APP_ID != '' && secrets.BREPKIT_BOT_PRIVATE_KEY != '' }}
    outputs:
      release_created: ${{ steps.release.outputs['release_created'] }}
      tag_name: ${{ steps.release.outputs['tag_name'] }}
      prs_created: ${{ steps.release.outputs['prs_created'] }}
      pr: ${{ steps.release.outputs['pr'] }}
    steps:
      # Forks of this repo do not carry the bot app's credentials. Minting the
      # token unconditionally made the whole job fail before release-please
      # ever ran ("'client-id' ... must be set to a non-empty string"), so no
      # release PR, tag, or GitHub release was ever produced there. Mint it
      # only when the secrets exist and fall back to GITHUB_TOKEN.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ env.HAS_APP_CREDENTIALS == 'true' }}
        with:
          app-id: ${{ secrets.BREPKIT_BOT_APP_ID }}
          private-key: ${{ secrets.BREPKIT_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        # release-please can fail with "duplicate tag" (release already exists)
        # or "issue is locked" (can't comment on auto-merged PR). Both are
        # non-fatal — the release was created successfully. Publishing happens
        # independently via the release:created event trigger.
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  auto-merge:
    name: Auto-merge Release PR
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [release-please]
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP_CREDENTIALS: ${{ secrets.BREPKIT_BOT_APP_ID != '' && secrets.BREPKIT_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ env.HAS_APP_CREDENTIALS == 'true' }}
        with:
          app-id: ${{ secrets.BREPKIT_BOT_APP_ID }}
          private-key: ${{ secrets.BREPKIT_BOT_PRIVATE_KEY }}
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          echo "Enabling auto-merge for PR #$PR_NUMBER"
          # `--auto` needs the repo to allow auto-merge, which in turn needs a
          # protected branch with required checks. Where that is not set up
          # (forks), fall back to merging outright: a release PR only ever
          # carries release-please's own version bump and changelog.
          gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY" \
            || gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"

  # The committed package directory is a real distribution channel, not a
  # build leftover: OpenZCAD installs this repo as
  #   "brepkit-wasm": "github:esaueng/brepkit#main&path:/crates/wasm/pkg"
  # so npm/pnpm fetches whatever `crates/wasm/pkg` holds on main. Nothing
  # rebuilt it after a merge, so that directory drifted far behind the source
  # (2.126.20 committed vs 2.128.5 in Cargo.toml) and every consumer silently
  # ran a months-old kernel while main looked current.
  build-committed-package:
    name: Build committed WASM package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Skip the bot's own commit so this cannot loop. `[skip ci]` in the commit
    # message already suppresses the re-run; this is the belt-and-braces half.
    #
    # Also runnable on demand: GitHub does not raise workflow runs for a push
    # that edits files under .github/workflows, so a change to this file only
    # takes effect on the NEXT ordinary commit. Without a manual trigger there
    # is no way to refresh the package — or to prove a change here works —
    # until some unrelated PR happens to land.
    if: >-
      ${{ (github.event_name == 'push'
           && !contains(github.event.head_commit.message, '[skip ci]'))
          || (github.event_name == 'workflow_dispatch'
              && inputs.sync_package
              && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # A dispatch may select another ref in the UI. Keep repository code
          # pinned to the protected branch.
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # rust-toolchain.toml provides the pinned Rust version + wasm32 target
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: wasm-pack

      # Same command the npm publish job runs, so the committed package and a
      # published one are built identically.
      - name: Build, merge, validate, and smoke-test WASM package
        run: cargo xtask wasm-build --skip-opt

      # Point consumers of the committed directory at this repo. Deliberately
      # stable fields only — stamping the commit SHA here would make the diff
      # non-empty on every run and commit even when the kernel is unchanged.
      - name: Stamp fork provenance
        working-directory: crates/wasm/pkg
        run: |
          npm pkg set \
            repository.type=git \
            repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git \
            homepage=https://github.com/${GITHUB_REPOSITORY}

      # Pass only the generated package to a fresh runner. The build above can
      # execute third-party build scripts, so it must never share a process,
      # workspace, or Git directory with a repository write token.
      - name: Archive generated package
        # Use the system binary by absolute path: build scripts can append a
        # malicious replacement to GITHUB_PATH for later steps in this job.
        run: /usr/bin/tar -czf committed-wasm-package.tar.gz crates/wasm/pkg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: committed-wasm-package
          path: committed-wasm-package.tar.gz
          if-no-files-found: error

  sync-committed-package:
    name: Commit refreshed WASM package
    needs: [build-committed-package]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      HAS_APP_CREDENTIALS: ${{ secrets.BREPKIT_BOT_APP_ID != '' && secrets.BREPKIT_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ env.HAS_APP_CREDENTIALS == 'true' }}
        with:
          app-id: ${{ secrets.BREPKIT_BOT_APP_ID }}
          private-key: ${{ secrets.BREPKIT_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Keep repository code and the eventual package commit pinned to
          # the protected branch.
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: committed-wasm-package

      - name: Install generated package
        run: |
          # Do not extract an artifact produced by untrusted build-time code
          # into the checkout. The installer accepts only regular files and
          # directories beneath crates/wasm/pkg and writes only to that tree.
          /usr/bin/python3 scripts/install-wasm-package-archive.py \
            committed-wasm-package.tar.gz crates/wasm/pkg

      - name: Commit refreshed package
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # Disable every Git hook, including post-commit and pre-push hooks
          # that --no-verify does not suppress, while a write token is present.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # wasm-pack drops a `*` .gitignore into its output directory, so the
          # published files are only tracked because they were force-added.
          # Staging with --force keeps that true for anything the generator
          # starts emitting — otherwise a new required file would be silently
          # left out of the package consumers install.
          git add --force crates/wasm/pkg
          if git diff --cached --quiet -- crates/wasm/pkg; then
            echo "Committed package already matches this build — nothing to do."
            exit 0
          fi
          VERSION=$(jq -r .version crates/wasm/pkg/package.json)
          git commit --no-verify -m "chore(wasm): refresh committed package to v${VERSION} from ${GITHUB_SHA:0:7} [skip ci]"
          # Land on top of anything that merged while the build was running.
          # Authenticate with a token-embedded URL: checkout ran with
          # persist-credentials: false, so origin carries no credentials.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --autostash "$remote" main
          git push "$remote" HEAD:main
          echo "::notice::Committed brepkit-wasm ${VERSION}; consumers on #main pick it up on the next install."

  # Publish triggers on two events:
  # 1. release:created — release-please creates the GitHub release with the bot
  #    app token, so this event always fires (default-GITHUB_TOKEN suppression
  #    does not apply) even if release-please crashes afterward trying to
  #    comment on the locked/merged PR. The push run must NOT also publish via
  #    the release_created output: when release-please succeeds fully, both
  #    runs race the registries and the loser turns main red with
  #    already-published errors.
  # 2. workflow_dispatch — manual publish for a specific version
  publish:
    name: Build WASM & Publish
    needs: [release-please]
    # A manual run only publishes when it was given a version; a bare dispatch
    # is the "just refresh the committed package" path.
    if: >-
      always() && (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_version != '')
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # rust-toolchain.toml provides the pinned Rust version + wasm32 target
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.62.30
        with:
          tool: wasm-pack

      - name: Build, merge, validate, and smoke-test WASM package
        run: cargo xtask wasm-build --skip-opt

      - name: Validate npm package contents
        working-directory: crates/wasm/pkg
        run: npm pack --dry-run

      - name: Verify version
        working-directory: crates/wasm/pkg
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "Publishing brepkit-wasm@$PKG_VERSION"
        env:
          TAG_NAME: ${{ github.event.release.tag_name || format('v{0}', github.event.inputs.publish_version) }}

      - name: Publish to npm (skip if already published)
        working-directory: crates/wasm/pkg
        run: |
          # Only the upstream repo holds the npm credentials for this package
          # name. Forks reach their consumers through the committed
          # `crates/wasm/pkg` directory instead, so a missing token is an
          # expected configuration, not a failure.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not configured — skipping npm publish."
            exit 0
          fi
          PKG_VERSION=$(jq -r .version package.json)
          if npm view "brepkit-wasm@$PKG_VERSION" version 2>/dev/null; then
            echo "brepkit-wasm@$PKG_VERSION already published — skipping"
            exit 0
          fi
          npm publish --provenance --access public 2>&1 || {
            # Handle race condition: concurrent run published between our check and publish
            if npm view "brepkit-wasm@$PKG_VERSION" version 2>/dev/null; then
              echo "brepkit-wasm@$PKG_VERSION published by concurrent run — skipping"
              exit 0
            fi
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes the Rust crates. Separate from the WASM job so a crates.io outage
  # cannot block the npm release (brepjs pins the npm package, not the crates).
  publish-crates:
    name: Publish to crates.io
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: crates-io
    env:
      TAG_NAME: ${{ github.event.release.tag_name || format('v{0}', github.event.inputs.publish_version) }}
    steps:
      # Pinned to the tag rather than the default branch: a delayed
      # `release:created` event or a manual dispatch would otherwise publish
      # whatever main has advanced to instead of what was tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      # rust-toolchain.toml provides the pinned Rust version
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Belt and braces now that the checkout is tag-pinned: catches a tag whose
      # Cargo.toml somehow disagrees with the tag name.
      - name: Verify workspace version matches the tag
        run: |
          WS_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "brepkit-math") | .version')
          if [ "$WS_VERSION" != "${TAG_NAME#v}" ]; then
            echo "::error::Version mismatch: workspace=$WS_VERSION tag=${TAG_NAME#v}"
            exit 1
          fi
          echo "Publishing brepkit crates at $WS_VERSION"

      # Verification compiles package contents and may execute third-party
      # build scripts and proc macros. Keep it in a separate step before any
      # crates.io credential exists in the job environment; the authenticated
      # script below is deliberately upload-only (`cargo publish --no-verify`).
      - name: Verify publishable packages without credentials
        run: cargo publish --workspace --dry-run

      # Trusted publishing: mints a short-lived crates.io token from the
      # workflow's OIDC identity, so there is no long-lived registry secret to
      # rotate or leak. Configured on crates.io per crate under Settings ->
      # Trusted Publishing.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Same script a human runs to bootstrap a new crate name, so the release
      # path and the manual path cannot drift.
      - name: Publish crates (skip any already published)
        run: ./scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
